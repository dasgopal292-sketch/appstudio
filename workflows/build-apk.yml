name: Build Studio Pixy Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android project root
        run: |
          set -euo pipefail
          for required in "settings.gradle.kts" "build.gradle.kts" "app/build.gradle.kts"; do
            if [ ! -f "$required" ]; then
              echo "::error::Missing required Android project file at repository root: $required"
              ls -la
              exit 1
            fi
          done

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK & accept licenses
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1 & Wrapper caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure Gradle 9.3.1 Wrapper is present and executable
        run: |
          set -euo pipefail
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "::warning::Gradle wrapper file missing in repository; regenerating Gradle 9.3.1 wrapper."
            gradle wrapper --gradle-version 9.3.1 --no-daemon
          fi
          chmod +x ./gradlew
          ./gradlew --version

      - name: Restore and verify Firebase-registered debug keystore
        run: |
          set -euo pipefail
          if [ ! -f "debug.keystore.base64" ]; then
            echo "::error::debug.keystore.base64 is missing. Cannot restore the Firebase-registered debug signing key."
            exit 1
          fi

          base64 -d debug.keystore.base64 > debug.keystore

          KEYTOOL_OUT=$(keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android)
          ACTUAL_SHA1=$(printf '%s\n' "$KEYTOOL_OUT" \
            | awk -F'SHA1:[[:space:]]*' '/^[[:space:]]*SHA1:/ && !done { gsub(/[:[:space:]]/, "", $2); print tolower($2); done=1 }')

          EXPECTED_SHA1="7cf2e635e84a0f996d17eb4487b5b74bd9b3ecfd"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Restored debug.keystore SHA-1 ($ACTUAL_SHA1) does not match Firebase-registered SHA-1 ($EXPECTED_SHA1)."
            exit 1
          fi

          echo "Verified debug.keystore SHA-1 matches Firebase Google Sign-In config: $ACTUAL_SHA1"

      - name: Build Studio Pixy Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK & signing certificate
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          META_PATH="app/build/outputs/apk/debug/output-metadata.json"

          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected APK not found at $APK_PATH"
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK file at $APK_PATH is empty."
            exit 1
          fi

          unzip -tq "$APK_PATH" > /dev/null
          if ! unzip -l "$APK_PATH" | awk '/AndroidManifest\.xml/ { found=1 } END { exit !found }'; then
            echo "::error::Invalid APK: missing AndroidManifest.xml"
            exit 1
          fi

          if [ ! -f "$META_PATH" ] || ! grep -q '"applicationId": "com.studiopixy.app"' "$META_PATH" || ! grep -q '"variantName": "debug"' "$META_PATH"; then
            echo "::error::APK metadata does not match app module debug variant for com.studiopixy.app"
            exit 1
          fi

          APKSIGNER=$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::apksigner executable not found under Android SDK build-tools."
            exit 1
          fi

          CERT_INFO=$("$APKSIGNER" verify --print-certs "$APK_PATH")
          APK_SHA1=$(printf '%s\n' "$CERT_INFO" \
            | awk -F'SHA-1 digest:[[:space:]]*' '/SHA-1 digest:/ && !done { gsub(/[[:space:]]/, "", $2); print tolower($2); done=1 }')

          EXPECTED_SHA1="7cf2e635e84a0f996d17eb4487b5b74bd9b3ecfd"
          if [ -z "$APK_SHA1" ] || [ "$APK_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Signed APK SHA-1 ($APK_SHA1) does not match Firebase-registered SHA-1 ($EXPECTED_SHA1)."
            exit 1
          fi

          ls -lh "$APK_PATH"
          echo "APK verified successfully with Firebase SHA-1: $APK_SHA1"

      - name: Upload Debug APK Actions Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-pixy-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Debug APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="studio-pixy-debug-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Studio Pixy Android APK Build #${{ github.run_number }}"
          NOTES=$(cat <<EOF
          Automatically generated **Studio Pixy** Android Debug APK (\`com.studiopixy.app\`).

          - **Build Type:** Debug APK (for testing only, not a Play Store production release)
          - **Built With:** GitHub Actions (Gradle 9.3.1 Wrapper / AGP 9.1.1 / JDK 21)
          - **Build Number:** #${{ github.run_number }} (Attempt ${{ github.run_attempt }})
          - **Source Commit:** ${{ github.sha }}
          EOF
          )

          gh release create "$TAG" \
            "app/build/outputs/apk/debug/app-debug.apk" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report Build & Release Status
        if: steps.upload_artifact.outcome == 'success'
        run: |
          echo "### Studio Pixy Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **APK Build & Verification:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Actions Artifact:** \`studio-pixy-debug-apk\` uploaded and retained" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "- **GitHub Release:** Published (\`studio-pixy-debug-${{ github.run_number }}-${{ github.run_attempt }}\`)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::APK build and artifact upload succeeded, but GitHub Release publishing was skipped/failed. Download the APK from the workflow artifact 'studio-pixy-debug-apk'."
            echo "- **GitHub Release:** Not published (Actions artifact \`studio-pixy-debug-apk\` is available)" >> "$GITHUB_STEP_SUMMARY"
          fi
